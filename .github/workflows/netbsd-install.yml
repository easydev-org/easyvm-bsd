name: netbsd

# netbsd, AS ONE STAGE: sysinst, answered blind, to a published disk.
#
# THE WALK DOES NOT READ THE SCREEN AND THAT IS MEASURED, NOT LAZY. sysinst draws on a 720x400 VGA
# text mode with a small low-contrast font and tesseract cannot read it - MEASURED, probing the menu
# region of a live installer returned
#
#	none of "zzzznotpresent" in "j- oie alll i estes Meal AA eee Lelalaentaitor AA ..."
#
# The other three BSD installers here draw at 640x480 or larger and ARE read. So every step in
# `netbsd/steps/install.walk` carries `settle:` and the sequence was measured key by key.
#
# THE MEDIUM IS BOOTED BY BIOS, NOT UEFI. sysinst writes GPT or MBR plus BIOS bootblocks; the medium
# starts through its own El Torito image and the disk through the bootblocks it writes. A UEFI boot
# would need an ESP this installer does not make on the default path.
#
# TWO ANSWERS DEFAULT TO `No` AND BOTH ARE NEEDED: `Shall we continue?` (pressing return there
# returns to the main menu with nothing written) and `Enable sshd` / `Enable xdm`.
#
# THE BOOTBLOCKS PAGE IS A SELECTION, NOT A SUBMIT. `x: Continue` commits it and runs `installboot`;
# MEASURED, a return there leaves sixteen zero bytes at offset 440 and the firmware falls through to
# the CD-ROM with "Boot failed: Could not read from CDROM (code 0003)".
#
# THE NETWORK IS NOT CONFIGURED HERE. `Configure network` TERMINATES sysinst at its netmask prompt on
# this medium - MEASURED, "sysinst terminated. To return to the installer, quit this shell ...". That
# happens AFTER the sets are extracted, so the disk is complete. Xfce and the interface come up in
# `ssh.walk`, because a package install is a network operation and this stage has none.

on:
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the disks"
        default: "easydev-org/easyvm-bsd"

concurrency:
  group: netbsd-install
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  install:
    # THE BRANCH THAT MAKES THE FLOOR AN INPUT, UNTIL IT MERGES AND TAGS.
    # `@v0.0.4` hard-codes 512 MiB, which refuses this leg's real 511 MiB system and once pushed the
    # walk into writing 1.1 GiB of urandom to clear it. Once `floor-input` lands and is tagged, this
    # goes back to a tag.
    uses: easydev-org/easyvm/.github/workflows/stage.yml@floor-input
    secrets: inherit
    with:
      image_repository: easydev-org/easyvm
      image_tag: v0.0.4
      # TWENTY GIBABYTES, AND THE DISK IS THE ONE THE WALK PARTITIONS - sysinst takes the whole of it.
      #
      # MEASURED on runs 45670461290 and 45674988364: the walk FINISHED with a 1,644 MiB installed
      # disk - every set extracted - but `save` compresses with zstd and an FFS install is mostly
      # zeros, so the published file came out 535,625,728 bytes against stage.yml's 512 MiB floor.
      # Going from 10 to 20 GiB did NOT change it: sysinst's default swap does not grow with the disk,
      # so the compressed size did not either.
      #
      # THE FLOOR IS NOT THE WALK'S PROBLEM, SO IT IS NO LONGER PATCHED IN THE WALK. For a while this
      # leg wrote 1.1 GiB of /dev/urandom into the swap slice to clear the check; MEASURED on run
      # 45906011040 that turned a 535 MiB system into a 1611 MiB image in which 1,100 MiB was random
      # bytes, so the published size said nothing about what was inside. The check is what was wrong,
      # and `stage.yml` now takes `disk_floor_mb` per leg.
      #
      # 400 MB, AND THE NUMBER IS CHECKABLE RATHER THAN CONVENIENT: a complete NetBSD 11.1 with every
      # set compresses to 535,887,872 bytes, so 400 leaves a third of the real size as headroom while
      # staying two thousand times above the 197,632-byte qcow2 header this check exists to refuse.
      disk_gb: "20"
      disk_floor_mb: "400"
      group: netbsd-install
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "bsd-netbsd-install",
            "file": "netbsd/steps/install.walk",
            "pull": "",
            "assets": ["iso-netbsd:netbsd.iso.tar"],
            "out": "bsd-netbsd-install.qcow2",
            "publish": "bsd-netbsd-install",
            "timeout": 120
          }
        ]
