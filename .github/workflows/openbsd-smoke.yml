name: openbsd-smoke

# DOES THE PUBLISHED DISK START? Boot it with NO medium attached, wait for an OpenBSD screen,
# record three minutes, kill it.
#
# THE CLAIM THE INSTALL LEG CANNOT MAKE. The install walk ends on the installer's own
# "CONGRATULATIONS!" line, which says the sets were unpacked; this is the file that says the firmware
# starts the disk and xenodm comes up. Both were MEASURED in a real guest before this existed.
#
# IT PUBLISHES NO DISK: `out:` is empty below, so the only artifact is the recording.

on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: >-
          the PUBLISHED disk to boot. Empty uses the tag this repository's install leg publishes.
        default: "bsd-openbsd-install"
      disks_repository:
        description: "the ghcr repository that holds the disk"
        default: "easydev-org/easyvm-bsd"

concurrency:
  group: openbsd-smoke
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  smoke:
    uses: easydev-org/easyvm/.github/workflows/stage.yml@v0.0.4
    secrets: inherit
    with:
      image_repository: easydev-org/easyvm
      image_tag: v0.0.4
      disk_gb: "20"
      group: openbsd-smoke
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "bsd-openbsd-smoke",
            "file": "openbsd/steps/smoke.walk",
            "pull": "${{ inputs.from_tag }}",
            "out": "",
            "timeout": 30
          }
        ]
