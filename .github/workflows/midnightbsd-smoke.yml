name: midnightbsd-smoke

# DOES THE PUBLISHED DISK START? Boot it under BIOS, wait for the loader's own line, record three
# minutes, kill it.
#
# BIOS AND NOT UEFI, because that is the only configuration in which this release is drivable at all:
# MEASURED, under OVMF its installer's `Console type [vt100]:` prompt took no key from the engine, the
# API, usb-kbd, an added i8042 or a PS/2 board, each on its own run, while the same image under BIOS
# takes every one.
#
# THE GATE IS `Loading /boot/defaults/loader.conf` ON THE CONSOLE - the loader having found the system
# it was told to start. A disk without bootblocks prints the firmware's "No bootable option" and
# never this line.
#
# IT PUBLISHES NO DISK: `out:` is empty below, so the only artifact is the recording.

on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: >-
          the PUBLISHED disk to boot. Empty uses the tag this repository's install leg publishes.
        default: "bsd-midnightbsd-install"
      disks_repository:
        description: "the ghcr repository that holds the disk"
        default: "easydev-org/easyvm-bsd"

concurrency:
  group: midnightbsd-smoke
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  smoke:
    uses: easydev-org/easyvm/.github/workflows/stage.yml@v0.0.4
    secrets: inherit
    with:
      image_repository: easydev-org/easyvm
      image_tag: v0.0.4
      disk_gb: "20"
      group: midnightbsd-smoke
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "bsd-midnightbsd-smoke",
            "file": "midnightbsd/steps/smoke.walk",
            "pull": "${{ inputs.from_tag }}",
            "out": "",
            "timeout": 30
          }
        ]
