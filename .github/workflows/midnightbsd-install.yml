name: midnightbsd

# midnightbsd, AS ONE STAGE: bsdinstall, answered by word, to a published disk. UFS.
#
# ITS INSTALLER IS FREEBSD'S bsdinstall AND ITS SCREENS READ. MEASURED in a real guest: every page
# OCRs cleanly - "MidnightBSD Installer", "Keymap Selection", "Set Hostname", "Distribution Select",
# "Partitioning" - so the walk gates on words the way freebsd's does. That is worth saying because
# netbsd's installer, on the same pod, does not: sysinst's 720x400 VGA font OCRs as noise.
#
# THE DISK IS UFS AND THE INSTALLER OFFERS IT AS A FIRST-CLASS CHOICE. The Partitioning page is
#
#	Auto (ZFS)   Guided Root-on-ZFS        <-- the default
#	Auto (UFS)   Guided UFS Disk Setup
#	Manual       Manual Disk Setup (experts)
#	Shell        Open a shell and partition by hand
#
# so UFS is one row down and then RETURN. This is the opposite of ghostbsd, whose GBI never offers
# UFS at all and whose disk is therefore ZFS.
#
# THE DESKTOP IS XFCE AND IT IS INSTALLED ON THE BOOTED SYSTEM. MidnightBSD's own documentation says
# its desktop is Xfce ("system configuration using Xfce", "we switched ... to Xfce as our desktop
# environment"), and the disc does not carry the packages - `mports` does. A package install is a
# network operation, so it belongs to `ssh.walk`.

on:
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the disks"
        default: "easydev-org/easyvm-bsd"

concurrency:
  group: midnightbsd-install
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  install:
    uses: easydev-org/easyvm/.github/workflows/stage.yml@v0.0.4
    secrets: inherit
    with:
      image_repository: easydev-org/easyvm
      image_tag: v0.0.4
      disk_gb: "10"
      group: midnightbsd-install
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "bsd-midnightbsd-install",
            "file": "midnightbsd/steps/install.walk",
            "pull": "",
            "assets": ["iso-midnightbsd:midnightbsd.iso.tar"],
            "out": "bsd-midnightbsd-install.qcow2",
            "publish": "bsd-midnightbsd-install",
            "timeout": 120
          }
        ]
