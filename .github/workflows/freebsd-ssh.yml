name: freebsd

# freebsd, AS A CHAIN OF JOBS THAT DEPEND ON EACH OTHER.
#
# THE SHAPE IS THE ONE THE OTHER DISTRIBUTIONS USE, AND THE REASON IS THE SAME ONE: the legs used to
# run as a parallel matrix, and a leg that asks for the tag the leg before it publishes gets a 404
# while that leg is still running. It then falls back to the INSTALL disk - which has no desktop - and burns its whole
# budget on a machine that could never answer.
#
# `needs:` IS THE FIX. A leg cannot start before the artifact it pulls exists, because it is not
# SCHEDULED until then. The cost is the sum rather than the maximum, and a serial chain that finishes
# is worth more than a parallel one whose third leg always times out.
#
# FREEBSD KEEPS ITS OWN CHAIN. THE NOTE THAT USED TO STAND HERE SAID GHOSTBSD WAS REPLACED BECAUSE
# ITS EFI LOADER WAS ZERO BYTES - AND THAT NOTE WAS OUT OF DATE, WHICH `ghostbsd-smoke` ITSELF SHOWS.
#
# THE MEASUREMENT THAT REPLACES IT. Run 45664907078 (`ghostbsd-smoke`, 03e6cbb) boots the published
# `bsd-ghostbsd-install` disk and its recording reaches the desktop:
#
#	=== a ghostbsd screen, which is what says the disk is not just bootable but usable
#	  [until]: __until__ = true (read "ghostbsd initial setup")
#
#	console.log:  Loading splash ok
#	              EFI framebuffer information:  dimensions 1920 x 1080
#
# and the frame is GhostBSD's own "GhostBSD Initial Setup / please select your language" window over
# its wallpaper - a disk that boots, draws, and is usable. SO GHOSTBSD GETS ITS OWN SSH STAGE TOO
# (`ghostbsd-ssh.yml`), rather than being replaced here.
#
# WHAT IS STILL TRUE, AND IS WHY THE TWO CHAINS STAY SEPARATE: FreeBSD and GhostBSD are the same base
# system but different installers - `bsdinstall` versus GBI - so a walk that drives one cannot drive
# the other. Each distribution has its own walk, its own tag and its own workflow.
#

on:
  # ONE STAGE, DISPATCHED BY HAND. This was a job inside `freebsd.yml`, where `needs:` decided the
  # order; each stage is its own workflow now.
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the disks"
        default: "easydev-org/easyvm-bsd"
      from_tag:
        description: >-
          the PUBLISHED disk this stage continues from (default bsd-freebsd-install)
        default: "bsd-freebsd-install"

concurrency:
  group: freebsd-ssh
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  ssh:
    uses: easydev-org/easyvm/.github/workflows/stage.yml@v0.0.4
    secrets: inherit
    with:
      image_repository: easydev-org/easyvm
      image_tag: v0.0.4
      disk_gb: "10"
      group: freebsd-ssh
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "bsd-freebsd-ssh",
            "file": "freebsd/steps/ssh.walk",
            "pull": "${{ inputs.from_tag }}",
            "out": "bsd-freebsd-ssh.qcow2",
            "publish": "bsd-freebsd-ssh",
            "timeout": 240
          }
        ]
