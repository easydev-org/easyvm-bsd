name: midnightbsd-ssh

# THE INSTALLED SYSTEM, OVER SSH, WITH THE DESKTOP THIS RELEASE IS BUILT AROUND.
#
# WHY THIS STAGE EXISTS AT ALL, IN ONE MEASUREMENT. The disc this repository installs from holds no
# desktop: `usr/midnightbsd-dist/` carries base, kernel, kernel-dbg, lib32, mports, src and tests -
# no xorg set, and `base.txz` unpacks to 28,172 entries with ZERO under `usr/X11R6`. So the install
# leg publishes a 677 MiB base system, and that is what disc1 contains rather than something the
# walk missed.
#
# MidnightBSD's answer is its own `firstboot` script, which asks for a package mirror and offers
# Xfce (midnightbsd.org/documentation/desktop.html). Xfce is also the desktop the project names as
# its own since 2021. A package install needs a network, so it belongs here: this leg boots the
# published disk, brings the interface up, installs from the project's mirror, starts xdm, and
# requires the session to be DRAWING before it publishes.
#
# IT PUBLISHES A DISK, AND IT IS THE ONE THE vm-configure LEG CONTINUES FROM.
#
# `from_tag` DEFAULTS TO THE DISK THE INSTALL LEG PUBLISHES. Passing a different tag is how a run
# re-uses a disk that already has Xfce on it - which is what a fix to the last few steps wants,
# because the package install is the long part.

on:
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the disks"
        default: "easydev-org/easyvm-bsd"
      from_tag:
        description: >-
          the PUBLISHED disk this stage continues from (default bsd-midnightbsd-install)
        default: "bsd-midnightbsd-install"

concurrency:
  group: midnightbsd-ssh
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  ssh:
    uses: easydev-org/easyvm/.github/workflows/stage.yml@floor-input
    secrets: inherit
    with:
      image_repository: easydev-org/easyvm
      image_tag: v0.0.4
      # THE DESKTOP NEEDS ROOM: xorg and xfce4 unpack to a gigabyte or more, and the working copy has
      # to hold the base disk, that unpacked tree and the compressed result at once.
      disk_gb: "20"
      group: midnightbsd-ssh
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "bsd-midnightbsd-ssh",
            "file": "midnightbsd/steps/ssh.walk",
            "pull": "${{ inputs.from_tag }}",
            "out": "bsd-midnightbsd-ssh.qcow2",
            "publish": "bsd-midnightbsd-ssh",
            "timeout": 240
          }
        ]
