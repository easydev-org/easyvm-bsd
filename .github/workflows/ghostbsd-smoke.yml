name: ghostbsd-smoke

# DOES THE PUBLISHED DISK START? Boot it with NO medium attached, wait for a GhostBSD screen,
# record three minutes, kill it.
#
# THE CLAIM THE INSTALL LEG CANNOT MAKE. GBI's last page says "Installation is complete"; what it
# has proven is that files were copied. This is the file that says the disk boots - and it is the
# check that would catch the defect this repository's FreeBSD notes record against GBI, a ZERO-BYTE
# BOOTX64.EFI in the ESP.
#
# IT PUBLISHES NO DISK: `out:` is empty below, so the only artifact is the recording.

on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: >-
          the PUBLISHED disk to boot. Empty uses the tag this repository's install leg publishes.
        default: "bsd-ghostbsd-install"
      disks_repository:
        description: "the ghcr repository that holds the disk"
        default: "easydev-org/easyvm-bsd"

concurrency:
  group: ghostbsd-smoke
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  smoke:
    uses: easydev-org/easyvm/.github/workflows/stage.yml@v0.0.4
    secrets: inherit
    with:
      image_repository: easydev-org/easyvm
      image_tag: v0.0.4
      disk_gb: "20"
      group: ghostbsd-smoke
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "bsd-ghostbsd-smoke",
            "file": "ghostbsd/steps/smoke.walk",
            "pull": "${{ inputs.from_tag }}",
            "out": "",
            "timeout": 30
          }
        ]
